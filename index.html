<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIP Calculator | Financial Mindset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#fff;--tint:#f5f8f6;--ink:#12261c;--muted:#5b6b62;--green:#0f4a31;--green-2:#176b49;--gold:#b8963e;--gold-soft:#f3ead3;--line:#e3e9e5;--shadow:0 1px 2px rgba(15,74,49,.06),0 8px 24px -12px rgba(15,74,49,.18);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1511;--surface:#141f19;--tint:#101a15;--ink:#e8efea;--muted:#9fb0a6;--green:#6fcf9f;--green-2:#8be0b3;--gold:#d4b25e;--gold-soft:#2a2514;--line:#243229;--shadow:none}}
:root[data-theme="dark"]{--bg:#0d1511;--surface:#141f19;--tint:#101a15;--ink:#e8efea;--muted:#9fb0a6;--green:#6fcf9f;--green-2:#8be0b3;--gold:#d4b25e;--gold-soft:#2a2514;--line:#243229;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 "Inter","Noto Sans Bengali",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[lang="bn"] body{line-height:1.75}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:21px;color:var(--green);display:flex;align-items:center;gap:10px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--gold);display:inline-block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--tint)}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:5px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
:root:not([data-theme="dark"]) .lang button[aria-pressed="true"]{color:#fff}
.hero{padding:36px 0 22px}
.hero h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(30px,5vw,44px);line-height:1.2;margin:0;color:var(--green)}
html[lang="bn"] .hero h1{font-family:"Noto Sans Bengali",sans-serif;font-weight:600}
.rule{width:56px;height:3px;background:var(--gold);border-radius:2px;margin:16px 0 12px}
.hero p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:370px 1fr;gap:22px;align-items:start;padding-bottom:64px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
#inp{position:sticky;top:16px}
.fld{margin-top:22px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:15px;font-weight:500}
.fv{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--tint)}
.fv:focus-within{border-color:var(--gold)}
.fv input{width:100px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;text-align:right;outline:0}
.fv em{font-style:normal;color:var(--muted);font-size:14px}
.rg{width:100%;accent-color:var(--green)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--tint)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:8px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--bg)}
:root:not([data-theme="dark"]) .seg button[aria-pressed="true"]{color:#fff}
.sw{display:flex;align-items:center;gap:12px;margin-top:26px;font-size:15px;font-weight:500;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.trk{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+.trk{background:var(--green)}
.sw input:checked+.trk::after{transform:translateX(18px)}
.sw input:focus-visible+.trk{outline:2px solid var(--gold);outline-offset:3px}
.inf.off{opacity:.55}
.fv input[data-m]{width:112px}
.wd{text-align:right;font-size:13px;color:var(--green-2);margin:-6px 0 10px;min-height:1.3em;font-weight:500}
.mdx{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.55;padding:10px 12px;border-left:3px solid var(--gold);background:var(--tint);border-radius:0 10px 10px 0}
.mdx b{color:var(--green)}
.ibox{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--tint)}
.icols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.ic{border-radius:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line)}
.ic.r{border-color:var(--gold);background:var(--gold-soft)}
.ic span{display:block;font-size:13px;color:var(--muted)}
.ic b{display:block;font-size:20px;line-height:1.35}
.ic small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.pbar{height:12px;border-radius:7px;background:var(--gold);overflow:hidden;margin-top:16px}
.pbar i{display:block;height:100%;background:var(--green);border-radius:7px 0 0 7px}
.pcap{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.pcap b{color:var(--ink)}
.isent{margin:12px 0 0;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;background:var(--surface);color:var(--muted)}
.chips b{color:var(--ink)}
@media (max-width:420px){.icols{grid-template-columns:1fr}}
.sub{margin-top:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--tint)}
.sub .fld{margin-top:16px}
.big{background:var(--green);color:var(--bg);border-radius:12px;padding:18px 20px}
:root:not([data-theme="dark"]) .big{color:#fff}
.big span{display:block;font-size:14px;opacity:.85}
.big b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:clamp(28px,5vw,38px);line-height:1.25}
html[lang="bn"] .big b{font-family:"Noto Sans Bengali",sans-serif}
.big small{opacity:.8;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.stats div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stats span{display:block;color:var(--muted);font-size:13px}
.stats b{font-size:17px}
.stats .g b{color:var(--green-2)}
h3.cap{font-size:15px;margin:0 0 4px;font-weight:600}
.cc{margin-top:26px}
.hint{color:var(--muted);font-size:13px;margin:22px 0 0}
.ch{display:block;width:100%;height:auto}
.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:var(--gold);fill-opacity:.2}
.seg2{cursor:pointer;transition:stroke-width .12s}
.seg2:hover{stroke-width:30}
.lg{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
.lg u{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;text-decoration:none}
.adv{margin-top:26px}
.adv ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.adv li{border-left:3px solid var(--gold);background:var(--tint);border-radius:0 10px 10px 0;padding:10px 14px;font-size:15px}
#tip{position:fixed;z-index:50;left:0;top:0;opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;max-width:240px;transition:opacity .1s}
.fw{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.soc{display:flex;gap:18px}
.soc a{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-weight:500;text-decoration:none}
.soc a:hover{color:var(--gold)}
.soc svg{width:18px;height:18px;fill:currentColor}
footer{border-top:1px solid var(--line);padding:20px 0 28px;color:var(--muted);font-size:14px}
@media (max-width:900px){.layout{grid-template-columns:1fr}#inp{position:static}}
@media (max-width:560px){.wrap{padding:0 14px}.panel{padding:16px}.hero{padding-top:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function T(){return D[lang]}
function num(n,d){return n.toLocaleString(lang==='bn'?'bn-BD':'en-IN',{minimumFractionDigits:0,maximumFractionDigits:d})}
function sh(n){var t=T(),a=Math.abs(n),s=n<0?'−':'';if(a>=1e7)return s+'৳'+num(a/1e7,2)+' '+t.cr;if(a>=1e5)return s+'৳'+num(a/1e5,2)+' '+t.lk;return s+'৳'+num(a,0)}

function ay(v){var t=T();if(v>=1e7)return num(v/1e7,v>=1e8?0:1)+t.crs;if(v>=1e5)return num(v/1e5,v>=1e6?0:1)+t.lks;if(v>=1e3)return num(v/1e3,0)+t.ks;return num(v,0)}

function sim(o){var rm=o.r/1200,bal=o.l,inv=o.l,B=[o.l],I=[o.l],C=[0],M=[o.l],cur=o.p;
 for(var y=0;y<o.n;y++){cur=!o.step?o.p:o.st==='pct'?o.p*Math.pow(1+o.sv/100,y):o.p+o.sv*y;var c=0;
  for(var m=0;m<12;m++){bal=(bal+cur)*(1+rm);inv+=cur;c+=cur;M.push(bal)}
  B.push(bal);I.push(inv);C.push(c)}
 return {N:o.n,bal:B,inv:I,con:C,mo:M,last:cur}}
function sm(ov){var o={p:S.p,l:S.l,r:S.r,n:Math.round(S.n),step:S.step,st:S.st,sv:S.sv};for(var k in ov)o[k]=ov[k];return sim(o)}

var W=340,H=176,PL=46,PR=8,PT=8,PB=24,pw=W-PL-PR,ph=H-PT-PB;

function ax(mx,N,off,f){f=f||ay;var s='',k,i;
 for(k=0;k<=3;k++){var y=PT+ph-ph*k/3;s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(PL-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--muted)">'+f(mx*k/3)+'</text>'}

function c1(R,RB){var N=R.N,mx=R.bal[N]*1.02||1,X=function(i){return PL+i/N*pw},Y=function(v){return PT+ph-v/mx*ph},hi=[],lo=[],s=ax(mx,N),i;
 for(i=0;i<=N;i++){hi.push(X(i).toFixed(1)+','+Y(R.bal[i]).toFixed(1));lo.push(X(i).toFixed(1)+','+Y(R.inv[i]).toFixed(1))}
 s+='<polygon points="'+lo.join(' ')+' '+X(N)+','+Y(0)+' '+X(0)+','+Y(0)+'" fill="var(--green)"/><polygon points="'+hi.join(' ')+' '+lo.slice().reverse().join(' ')+'" fill="var(--gold)"/>';
 var w=pw/N;for(i=0;i<=N;i++)s+=hit(Math.max(PL,X(i)-w/2),w,tipY(i,R,RB));

 s+='<text x="90" y="87" text-anchor="middle" font-size="18" font-weight="600" fill="var(--ink)">'+num((1-f)*100,0)+'%</text><text x="90" y="102" text-anchor="middle" font-size="9" fill="var(--muted)">'+t.ret+'</text>';
 s+='<rect x="176" y="60" width="10" height="10" rx="3" fill="var(--green)"/><text x="192" y="69" font-size="11" fill="var(--muted)">'+t.inv+'</text><text x="192" y="84" font-size="12" font-weight="600" fill="var(--ink)">'+sh(inv)+'</text>';
 s+='<rect x="176" y="98" width="10" height="10" rx="3" fill="var(--gold)"/><text x="192" y="107" font-size="11" fill="var(--muted)">'+t.ret+'</text><text x="192" y="122" font-size="12" font-weight="600" fill="var(--ink)">'+sh(g)+'</text>';
 return svg(s)}
function c3(R){var t=T(),N=R.N,mx=1,gs=[],i;for(i=1;i<=N;i++){gs[i]=R.bal[i]-R.bal[i-1]-R.con[i];mx=Math.max(mx,R.con[i]+gs[i])}mx*=1.05;
 var s=ax(mx,N,1),bw=pw/N;
 for(i=1;i<=N;i++){var x=PL+(i-1)*bw,hc=R.con[i]/mx*ph,hg=Math.max(0,gs[i])/mx*ph;
  s+='<rect x="'+(x+bw*.15).toFixed(1)+'" y="'+(PT+ph-hc).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+hc.toFixed(1)+'" fill="var(--green)"/><rect x="'+(x+bw*.15).toFixed(1)+'" y="'+(PT+ph-hc-hg).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+hg.toFixed(1)+'" fill="var(--gold)"/>';
  s+=hit(x,bw,'<b>'+t.yearw+' '+i+'</b><br>'+t.ct+': '+sh(R.con[i])+'<br>'+t.gr+': '+sh(gs[i]))}
 return svg(s)}
function c4(R){var t=T(),N=R.N,bars=[],mx=1,base=R.bal[N];
 [-4,-2,0,2,4].forEach(function(d){var r=S.r+d;if(r>=0.5){var v=sm({r:r}).bal[N];bars.push({r:r,v:v,d:d});mx=Math.max(mx,v)}});

function c5(R,RB){var t=T(),N=R.N,s,i;
 if(S.inf){var mx=R.bal[N]*1.02||1,X=function(i){return PL+i/N*pw},Y=function(v){return PT+ph-v/mx*ph},a=[],b=[];
  for(i=0;i<=N;i++){a.push(X(i).toFixed(1)+','+Y(R.bal[i]).toFixed(1));b.push(X(i).toFixed(1)+','+Y(RB[i]).toFixed(1))}
  s=ax(mx,N)+'<polyline fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linejoin="round" points="'+a.join(' ')+'"/><polyline fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round" points="'+b.join(' ')+'"/>';
  var w=pw/N;for(i=0;i<=N;i++)s+=hit(Math.max(PL,X(i)-w/2),w,'<b>'+t.yearw+' '+i+'</b><br>'+t.nom+': '+sh(R.bal[i])+'<br>'+t.rl+': '+sh(RB[i])+'<br>'+t.loss+': '+sh(R.bal[i]-RB[i]));
  return svg(s)+leg([['var(--green)',t.nom],['var(--gold)',t.rl]])}
 var TG=[5e5,1e6,2.5e6,5e6,1e7,2.5e7,5e7,1e8,2.5e8,5e8,1e9],ms=[];
 TG.forEach(function(g){if(g>R.mo[0]&&ms.length<6){for(var m=0;m<R.mo.length;m++)if(R.mo[m]>=g){ms.push({g:g,y:m/12});break}}});
 if(!ms.length)return svg('<text x="170" y="90" text-anchor="middle" font-size="12" fill="var(--muted)">'+t.nomile+'</text>');
 var my=Math.max(1,N)*1.1,bw=pw/ms.length;s=ax(my,0,0,function(v){return num(v,0)});
 ms.forEach(function(q,i){var x=PL+i*bw,h=q.y/my*ph,y=PT+ph-h;
  s+='<rect x="'+(x+bw*.2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.6).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="var(--green)"/><text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">'+num(q.y,1)+'</text><text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+ay(q.g)+'</text>';
  s+=hit(x,bw,'<b>'+sh(q.g)+'</b><br>'+t.reach+' '+num(q.y,1)+' '+t.yrs)});

function advice(R){var t=T(),N=R.N,mat=R.bal[N],A=[],r2=Math.max(0.5,S.r-2),v2=sm({r:r2}).bal[N];

 if(N<5)A.push(t.a2s);else A.push(fill(t.a2l,{s:num((mat-R.inv[N])/mat*100,0)}));

 if(!S.step){var u=sm({step:true,st:'pct',sv:10}).bal[N];A.push(fill(t.a4n,{v:sh(u),d:sh(u-mat)}))}

 if(S.inf){var rv=mat/Math.pow(1+S.f/100,N);A.push(fill(t.a5y,{f:num(S.f,1),v:sh(mat),rv:sh(rv),q:num(rv/mat*100,0)}))}else A.push(t.a5n);

 document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===lang)});buildInp();out()}

var inp=document.getElementById('inp'),tip=document.getElementById('tip');
inp.addEventListener('input',function(e){var el=e.target,k=el.dataset.k;if(!k)return;var raw=el.value,v;if(el.dataset.m){v=fixMoney(el,raw);var w=document.getElementById('w-'+k);if(w)w.textContent=words(v)}else{v=parseFloat(raw);if(isNaN(v))return}var L=lim(k);S[k]=Math.min(L[1],Math.max(L[0],v));
 if(k==='f'&&!S.inf){S.inf=true;inp.querySelectorAll('[data-inf]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.inf==='1')});var wf=inp.querySelector('.inf');if(wf)wf.classList.remove('off')}
 inp.querySelectorAll('[data-k="'+k+'"]').forEach(function(o){if(o!==el)o.value=dv(o,S[k]);var w3=document.getElementById('w-'+k);if(w3&&!el.dataset.m)w3.textContent=words(S[k])});out()});
inp.addEventListener('focusout',function(e){var k=e.target.dataset&&e.target.dataset.k;if(k&&(e.target.type==='number'||e.target.dataset.m)){e.target.value=dv(e.target,S[k]);var w2=document.getElementById('w-'+k);if(w2)w2.textContent=words(S[k])}});
inp.addEventListener('change',function(e){if(e.target.id==='stp'){S.step=e.target.checked;buildInp();out()}});
inp.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.inf!=null)S.inf=b.dataset.inf==='1';else if(b.dataset.st){S.st=b.dataset.st;S.sv=S.st==='pct'?10:1000}else return;buildInp();out()});
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.l;try{localStorage.setItem('fm-lang',lang)}catch(e){}i18n()})});
function showTip(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.style.opacity=0;return}
 tip.innerHTML=el.getAttribute('data-tip');tip.style.opacity=1;var w=tip.offsetWidth,hh=tip.offsetHeight;
 tip.style.left=Math.min(window.innerWidth-w-8,Math.max(8,e.clientX+12))+'px';tip.style.top=Math.max(8,e.clientY-hh-12)+'px'}
document.addEventListener('pointermove',showTip);document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',function(){tip.style.opacity=0},{passive:true});
i18n();
</script>
